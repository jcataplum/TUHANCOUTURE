<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src https://checkout.wompi.co; form-action 'self' https://checkout.wompi.co; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Catálogo de jeans · TUHAN COUTURE</title>
  <meta name="description" content="Compra jeans de mujer de marca colombiana: wide leg, baggy, flare, mom y más. Tallas 4 a 16 con inventario en tiempo real.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0c0b09">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_CO">
  <meta property="og:site_name" content="TUHAN COUTURE">
  <meta property="og:title" content="Catálogo de jeans · TUHAN COUTURE">
  <meta property="og:description" content="Compra jeans de mujer de marca colombiana: wide leg, baggy, flare, mom y más. Tallas 4 a 16 con inventario en tiempo real.">
  <meta property="og:image" content="assets/img/logo-tuhan.jpeg">
  <link rel="icon" href="assets/img/logo-tuhan.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="assets/img/logo-tuhan.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&family=Pinyon+Script&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header id="site-header"></header>
  <main id="main" tabindex="-1">

    <div class="container">
      <div class="page-head">
        <nav class="breadcrumbs" aria-label="Ruta"><a href="index.html">Inicio</a> / <span id="crumb">Catálogo</span></nav>
        <h1 id="catTitle">Catálogo</h1>
        <p class="muted" id="catDesc">Encuentra tu jean ideal.</p>
      </div>
      <div class="catalog">
        <aside class="filters" id="filters" aria-label="Filtros">
          <fieldset><legend>Categoría</legend><div class="chip-group" id="fCategory"></div></fieldset>
          <fieldset><legend>Colección</legend><div class="chip-group" id="fCollection"></div></fieldset>
          <fieldset><legend>Talla</legend><div class="chip-group" id="fSize"></div></fieldset>
          <fieldset><legend>Color</legend><div class="chip-group" id="fColor"></div></fieldset>
          <fieldset><legend>Disponibilidad</legend>
            <label class="check"><input type="checkbox" id="fAvailable"> Solo con inventario</label>
          </fieldset>
          <button class="btn btn-line btn-sm" type="button" id="fClear">Limpiar filtros</button>
        </aside>
        <div>
          <div class="toolbar">
            <button class="btn btn-line btn-sm filters-toggle" type="button" id="filtersToggle" aria-expanded="false" aria-controls="filters">Filtrar</button>
            <p class="muted small" id="catCount" aria-live="polite" style="margin:0"></p>
            <label class="visually-hidden" for="sort">Ordenar</label>
            <select class="select" id="sort">
              <option value="featured">Destacados</option>
              <option value="new">Más recientes</option>
              <option value="price-asc">Precio: menor a mayor</option>
              <option value="price-desc">Precio: mayor a menor</option>
              <option value="name">Nombre A–Z</option>
            </select>
          </div>
          <div class="grid-products" id="catalogGrid"></div>
        </div>
      </div>
      <section class="section" id="guia-tallas" aria-labelledby="sizeTitle" style="padding-top:0">
        <div class="section-head"><div><p class="eyebrow">Encuentra tu talla</p><h2 id="sizeTitle">Guía de tallas</h2></div></div>
        <div id="sizeGuide" style="max-width:720px"></div>
      </section>
    </div>

  </main>
  <footer id="site-footer"></footer>
  <noscript><p style="padding:16px;text-align:center">Activa JavaScript para comprar en la tienda.</p></noscript>
  <script type="module" src="js/pages/catalog.js?v=2"></script>
</body>
</html>
